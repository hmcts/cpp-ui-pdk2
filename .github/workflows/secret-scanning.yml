name: Scanning
on:
  pull_request_target: # Changed from pull_request
    branches:
      - '**'
  schedule:
    - cron: '0 4 * * 4'
  workflow_dispatch:

jobs:
  scan:
    name: Secrets Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }} # Checkout the PR branch

      - uses: ./.github/actions/secret-scanner
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gitleaks_license: ${{ secrets.GITLEAKS_LICENSE }}
          gitleaks_regex_internal_url: ${{ secrets.HMCTS_CP_GITLEAKS_REGEX_INTERNAL_URL }}
          gitleaks_regex_banned_ids: ${{ secrets.HMCTS_CP_GITLEAKS_REGEX_BANNED_IDS }}
