<div class="cpp-address-postcode-finder" pdk-margin-bottom="2">
  @let disabled = isDisabled();

  <!-- pdk-form on a div: isolates the search from any consuming form's submit. -->
  <div [formGroup]="searchForm" pdk-form (errors)="errors.emit($event)" (validSubmit)="runSearch()">
    <pdk-form-field
      label="Find by postcode"
      labelType="small"
      [errorMessages]="[
        { rule: 'required', message: 'Enter a full UK postcode' },
        { rule: 'postcode', message: 'Enter a valid UK postcode' }
      ]"
    >
      <div class="cpp-address-postcode-finder__search">
        <input
          [pdk-input]="10"
          pdk-text-input="postcode"
          formControlName="postcode"
          (keydown.enter)="onEnter($event)"
        />

        <button pdk-button="secondary" type="button" [disabled]="disabled" (click)="submitSearch()">
          Find address
        </button>
      </div>
    </pdk-form-field>
  </div>

  @if (results(); as found) { @if (found.length) {
  <pdk-form-field
    [label]="resultsLabel()"
    labelType="small"
    pdk-margin-top="2"
    pdk-margin-bottom="2"
  >
    <pdk-radio-group
      small
      [options]="addressOptions()"
      [disabled]="disabled"
      ngModel
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="selectAddress($event)"
    ></pdk-radio-group>
  </pdk-form-field>
  } @else {
  <pdk-inset-text pdk-margin-top="2">No addresses found</pdk-inset-text>
  } } @if (failureMessage(); as message) {
  <pdk-inset-text pdk-margin-top="2">{{ message }}</pdk-inset-text>
  }
</div>
